version: '3'

# Routina build tasks (go-task). Fennel sources in src/ are compiled
# ahead-of-time to Lua under build/ (gitignored); the Fennel runtime is never
# shipped. Tests run under busted via the Fennel searcher (see spec/helper.lua).
#
# One-time setup:  task deps   (installs busted + luacov into ~/.luarocks)

vars:
  FENNEL_VERSION: '1.6.1'
  ADDONS: '/Applications/World of Warcraft/_anniversary_/Interface/AddOns'
  FNL_FILES:
    sh: find src spec scripts -name '*.fnl'

tasks:
  default:
    desc: Compile all Fennel sources to build/
    deps: [build]

  build:
    desc: Compile all Fennel sources to build/
    deps: [compile]

  compile:
    desc: Compile each src/**/*.fnl to the matching build/**/*.lua
    sources:
      - src/**/*.fnl
    generates:
      - build/**/*.lua
    cmds:
      - rm -rf build
      - |
        find src -name '*.fnl' | while IFS= read -r f; do
          out="build/${f#src/}"; out="${out%.fnl}.lua"
          mkdir -p "$(dirname "$out")"
          fennel --compile "$f" > "$out"
        done
      - 'echo "compiled $(find build -name ''*.lua'' | wc -l | tr -d '' '') file(s) to build/"'

  dev:
    desc: Watch src/ and recompile on change (recompiles then exits on Ctrl-C)
    cmds:
      - task --watch compile

  test:
    desc: Run busted specs under luajit (Lua 5.1 API, like WoW)
    deps: [build]
    cmds:
      - ./.rocks/bin/busted

  coverage:
    desc: Run specs with coverage; luacov measures the compiled build/*.lua
    deps: [build]
    cmds:
      - ./.rocks/bin/busted --coverage
      - ./.rocks/bin/luacov
      - 'echo "--- luacov.report.out (summary tail) ---"'
      - tail -n 25 luacov.report.out

  lint:
    desc: Check formatting (fnlfmt) and that every source compiles
    cmds:
      # fnlfmt --check exits 0 even when files differ, so fail on its output.
      - |
        unformatted=$(find src spec scripts -name '*.fnl' -print0 | xargs -0 fnlfmt --check 2>&1)
        if [ -n "$unformatted" ]; then
          echo "$unformatted"
          echo "fnlfmt: not formatted -- run 'task fmt'"
          exit 1
        fi
      - |
        find src spec scripts -name '*.fnl' | while IFS= read -r f; do
          fennel --globals "*" --compile "$f" >/dev/null || exit 1
        done
      - 'echo "lint ok"'

  fmt:
    desc: Format all Fennel sources in place with fnlfmt
    cmds:
      - find src spec scripts -name '*.fnl' -print0 | xargs -0 fnlfmt --fix

  docs:
    desc: Regenerate docs/api.md from src/domain/* docstrings
    cmds:
      - fennel scripts/docgen.fnl

  profile:
    desc: Performance budget -- route.plan-week <5ms median over 100 fixture players (PRD M5)
    deps: [build]
    cmds:
      - luajit scripts/profile.lua

  package:
    desc: BigWigs packager dry run (verifies the addon ships correctly)
    deps: [build]
    cmds:
      - |
        # BigWigs packager needs bash >= 4.3; macOS /bin/bash is 3.2, so prefer Homebrew's.
        BASH_BIN=$(command -v /opt/homebrew/bin/bash || command -v /usr/local/bin/bash || command -v bash)
        # The packager skips all untracked files (git ls-files --others), which
        # would drop the gitignored build/ tree. Stage it for the duration of
        # the run so the compiled Lua ships, then unstage.
        git add -f -- build/
        if [ -f release.sh ]; then
          "$BASH_BIN" release.sh -d
        else
          curl -s https://raw.githubusercontent.com/BigWigsMods/packager/master/release.sh | "$BASH_BIN" -s -- -d
        fi
        status=$?
        git reset -q -- build/
        exit $status

  install:
    desc: Symlink this repo into the WoW AddOns folder as "Routina"
    deps: [build]
    cmds:
      - ln -sfn "{{.ROOT_DIR}}" "{{.ADDONS}}/Routina"
      - echo "linked {{.ROOT_DIR}} -> {{.ADDONS}}/Routina"

  libs:
    desc: Fetch Ace3/LibStub externals into Libs/ for local in-game testing (not committed)
    cmds:
      # Mirrors .pkgmeta externals via svn (same source the BigWigs packager
      # uses). Libs/ is gitignored; the packager re-fetches these at release.
      - |
        if ! command -v svn >/dev/null 2>&1; then
          echo "svn not found -- install Subversion (e.g. 'brew install svn'),"
          echo "or run 'task package' to let the BigWigs packager fetch libs."
          exit 1
        fi
        svn export --force https://repos.curseforge.com/wow/libstub/trunk Libs/LibStub
        svn export --force https://repos.wowace.com/wow/callbackhandler/trunk/CallbackHandler-1.0 Libs/CallbackHandler-1.0
        svn export --force https://repos.wowace.com/wow/ace3/trunk Libs/Ace3
      # SFX-Widgets lives on GitHub (no SVN mirror since GitHub dropped SVN);
      # fetch via a shallow git clone instead of svn export.
      - |
        rm -rf Libs/AceGUI-3.0_SFX-Widgets
        git clone --depth 1 https://github.com/SFX-WoW/AceGUI-3.0_SFX-Widgets.git Libs/AceGUI-3.0_SFX-Widgets
      - 'echo "fetched LibStub + CallbackHandler-1.0 + Ace3 + SFX-Widgets into Libs/"'

  deps:
    desc: Install busted + luacov into a luajit rocks tree (.rocks) for testing
    vars:
      JP:
        sh: brew --prefix luajit
    cmds:
      - luarocks --lua-version=5.1 --lua-dir="{{.JP}}" --tree=.rocks install busted LUA_INCDIR="{{.JP}}/include/luajit-2.1"
      - luarocks --lua-version=5.1 --lua-dir="{{.JP}}" --tree=.rocks install luacov LUA_INCDIR="{{.JP}}/include/luajit-2.1"

  vendor:
    desc: Re-download the pinned build-time Fennel compiler into vendor/
    cmds:
      - curl -fsSL "https://fennel-lang.org/downloads/fennel-{{.FENNEL_VERSION}}.lua" -o vendor/fennel.lua
      - echo "vendored Fennel {{.FENNEL_VERSION}}"

  vendor-bis-source:
    desc: Re-download the pinned GPL BiS source + derive item names into vendor/bis-source/
    vars:
      WARKDEV_SHA: 4875cc1096e4a276bb2cf55709993d5c5269be08
      NEXUS_SHA: 8339771805564c6de7850ff9428be8e841f69622
      WARKDEV: 'https://raw.githubusercontent.com/Warkdev/BestInSlotTBCClassic/{{.WARKDEV_SHA}}'
      NEXUS: 'https://raw.githubusercontent.com/nexus-devs/wow-classic-items/{{.NEXUS_SHA}}'
    cmds:
      - mkdir -p vendor/bis-source
      - |
        for f in bis_data items class inventoryslot; do
          curl -fsSL "{{.WARKDEV}}/data/$f.lua" -o "vendor/bis-source/$f.lua"
        done
      - curl -fsSL "{{.WARKDEV}}/LICENSE.txt" -o vendor/bis-source/LICENSE.warkdev.txt
      - curl -fsSL "{{.NEXUS}}/data/json/data.json" -o /tmp/routina-nexus-data.json
      - curl -fsSL "{{.NEXUS}}/data/json/zones.json" -o /tmp/routina-nexus-zones.json
      - luajit scripts/vendor-bis-names.lua /tmp/routina-nexus-data.json
      - luajit scripts/vendor-bis-drops.lua /tmp/routina-nexus-data.json /tmp/routina-nexus-zones.json
      - luajit scripts/vendor-yield-bosses.lua /tmp/routina-nexus-data.json /tmp/routina-nexus-zones.json
      - echo "vendored BiS source @ {{.WARKDEV_SHA}} (run 'task import-bis && task import-drops && task import-yields' next)"

  import-bis:
    desc: Regenerate src/domain/bis/*.fnl from vendor/bis-source/ (GPL BiS data)
    cmds:
      - luajit scripts/import-bis.lua
      - echo "now run 'task fmt && task build && task test' to finish"

  import-drops:
    desc: Regenerate src/domain/drops/data.fnl from vendor/bis-source/item-sources.lua
    cmds:
      - luajit scripts/import-drops.lua
      - echo "now run 'task fmt && task build && task test' to finish"

  import-yields:
    desc: Regenerate src/domain/yields/data.fnl from scripts/yields-curated.lua + zone-bosses.lua
    cmds:
      - luajit scripts/import-yields.lua
      - echo "now run 'task fmt && task build && task test' to finish"

  vendor-chain-source:
    desc: Re-download the pinned Attune chain data + derive quest names into vendor/chain-source/
    vars:
      ATTUNE_SHA: 6db364737b054be2b6bbf432a7420f62e2c84928
      ATTUNE: 'https://raw.githubusercontent.com/hippuli/Attune/{{.ATTUNE_SHA}}'
      QUESTIE_SHA: eeb96e57e42cc142df86dcd8833c95b1d77abad1
      QUESTIE: 'https://raw.githubusercontent.com/Questie/Questie/{{.QUESTIE_SHA}}'
    cmds:
      - mkdir -p vendor/chain-source
      - curl -fsSL "{{.ATTUNE}}/AttuneData.lua" -o vendor/chain-source/AttuneData.lua
      - curl -fsSL "{{.QUESTIE}}/Database/TBC/tbcQuestDB.lua" -o /tmp/routina-questie-quests.lua
      - luajit scripts/vendor-chain-names.lua /tmp/routina-questie-quests.lua
      - echo "vendored Attune @ {{.ATTUNE_SHA}} + Questie quest names @ {{.QUESTIE_SHA}} (run 'task import-chains' next)"

  import-chains:
    desc: Regenerate src/domain/chains/data.fnl from vendor/chain-source/AttuneData.lua
    cmds:
      - luajit scripts/import-chains.lua
      - echo "now run 'task fmt && task build && task test' to finish"

  clean:
    desc: Remove generated Lua artifacts and coverage output
    cmds:
      - rm -rf build
      - rm -f luacov.stats.out luacov.report.out
